name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Kunci rilis (opsional): isi rahasia KEYSTORE_B64 dan KEYSTORE_PASSWORD di pengaturan repo.
      - name: Prepare release key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Bila build gagal, tampilkan baris error kompilasi sebagai anotasi supaya mudah dibaca.
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "SHA-256" | head -1)
          echo "::notice::Signer ${SHA}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SupernovaNotch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SupernovaNotch
          path: SupernovaNotch.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Supernova Notch build ${{ github.run_number }}
          files: SupernovaNotch.apk
          prerelease: false
          make_latest: true
